<header>
    <div class="container nav">
        <div class="brand">
            <a href="index.html" class="brand-link">
                <div class="logo-mark" aria-hidden>
                    <img src="Company Logo/ENGIC-Logo-removebg-preview.png" alt="Engic Group">
                </div>
                <div class="brand-text">
                    <div class="brand-name">ENGIC GROUP</div>
                    <div class="brand-tagline">Engineering &amp; Architecture</div>
                </div>
            </a>
        </div>
        <nav>
            <button class="mobile-toggle" id="mobileToggle" aria-expanded="false" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul id="navList">
                <li><a href="index.html" data-nav="home">Home</a></li>
                <li><a href="about.html" data-nav="about">About</a></li>
                <li><a href="index.html#services" data-nav="services">Services</a></li>
                <li><a href="all-projects.html" data-nav="projects">Projects</a></li>
                <li><a href="blog.html" data-nav="blog">Blog</a></li>
                <li><a href="gallery.html" data-nav="gallery">Gallery</a></li>
                <li><a href="index.html#contact" class="nav-contact" data-nav="contact">Contact <span class="arrow">→</span></a></li>
            </ul>
        </nav>
    </div>

    <style>
        /* ============================================
           HEADER — Flows into hero (no separate box)
           Overrides any conflicting rule in styles.css
           ============================================ */

        header {
            background: transparent !important;
            background-image: none !important;
            border: none !important;
            border-bottom: none !important;
            box-shadow: none !important;
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: background 0.3s ease, backdrop-filter 0.3s ease;
        }

        /* When scrolling — subtle frosted blur so nav stays readable */
        header.scrolled {
            background: rgba(255, 255, 255, 0.82) !important;
            background-image: none !important;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0;
            min-height: 76px;
        }

        /* ---------- Brand ---------- */
        .brand-link {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
        }

        .brand .logo-mark {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary);
            border-radius: 10px;
            padding: 8px;
            width: 44px;
            height: 44px;
            transition: transform 0.25s ease;
            box-shadow: 0 4px 12px rgba(31, 78, 150, 0.15);
        }

        .brand .logo-mark img {
            height: 28px;
            width: auto;
            display: block;
        }

        .brand-link:hover .logo-mark {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(31, 78, 150, 0.22);
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.2px;
            color: #0a0a0a;
            line-height: 1.15;
        }

        .brand-tagline {
            font-size: 11px;
            color: #6b7280;
            font-weight: 400;
            letter-spacing: 0.2px;
            line-height: 1.2;
            margin-top: 1px;
        }

        /* ---------- Nav ---------- */
        nav ul {
            display: flex;
            gap: 34px;
            align-items: center;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        nav a {
            color: #6b7280;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 0.1px;
            position: relative;
            padding: 6px 0;
            transition: color 0.25s ease;
        }

        nav a:hover {
            color: #0a0a0a;
        }

        nav a.active {
            color: var(--primary);
            font-weight: 600;
        }

        nav a:not(.nav-contact)::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        nav a:not(.nav-contact):hover::after,
        nav a.active:not(.nav-contact)::after {
            width: 100%;
        }

        .nav-contact {
            color: var(--primary) !important;
            font-weight: 600 !important;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: gap 0.25s ease;
        }

        .nav-contact .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .nav-contact:hover {
            color: var(--primary-dark) !important;
            gap: 9px;
        }

        .nav-contact:hover .arrow {
            transform: translateX(2px);
        }

        .nav-contact::after {
            display: none !important;
        }

        /* ---------- Mobile toggle ---------- */
        .mobile-toggle {
            display: none;
            background: transparent;
            border: 0;
            cursor: pointer;
            flex-direction: column;
            gap: 5px;
            padding: 8px;
            margin-left: auto;
        }

        .mobile-toggle span {
            width: 22px;
            height: 1.8px;
            background: #0a0a0a;
            border-radius: 2px;
            transition: all 0.28s ease;
            display: block;
        }

        .mobile-toggle.active span:nth-child(1) {
            transform: rotate(45deg) translate(4.5px, 4.5px);
        }

        .mobile-toggle.active span:nth-child(2) {
            opacity: 0;
        }

        .mobile-toggle.active span:nth-child(3) {
            transform: rotate(-45deg) translate(4.5px, -4.5px);
        }

        /* ============================================
           MOBILE
           ============================================ */
        @media (max-width: 900px) {
            .nav {
                min-height: 68px;
                padding: 14px 0;
            }

            nav {
                display: flex;
                align-items: center;
            }

            nav ul {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 76px;
                right: 20px;
                left: auto;
                background: #ffffff;
                border: 1px solid rgba(10, 10, 10, 0.08);
                border-radius: 12px;
                box-shadow: 0 16px 40px rgba(31, 78, 150, 0.08);
                padding: 14px;
                min-width: 220px;
                gap: 2px;
                z-index: 1001;
            }

            nav ul.open {
                display: flex;
            }

            nav ul li {
                width: 100%;
            }

            nav a {
                display: block;
                padding: 12px 14px;
                border-radius: 8px;
                font-size: 15px;
                font-weight: 500;
                color: #0a0a0a;
            }

            nav a:hover {
                background: rgba(31, 78, 150, 0.05);
                color: #0a0a0a;
            }

            nav a:not(.nav-contact)::after {
                display: none;
            }

            nav a.active {
                background: rgba(31, 78, 150, 0.06);
                color: var(--primary);
            }

            .nav-contact {
                margin-top: 6px;
                border-top: 1px solid rgba(10, 10, 10, 0.06);
                padding-top: 14px;
                justify-content: space-between;
            }

            .mobile-toggle {
                display: flex;
            }
        }

        @media (max-width: 600px) {
            .brand-tagline {
                display: none;
            }
            .brand-name {
                font-size: 15px;
            }
            .brand .logo-mark {
                width: 40px;
                height: 40px;
                padding: 6px;
            }
            .brand .logo-mark img {
                height: 26px;
            }
            .nav {
                min-height: 62px;
                padding: 12px 0;
            }
            nav ul {
                top: 68px;
                right: 16px;
            }
        }
    </style>

    <script>
        // Auto-highlight the current page in nav
        (function() {
            const path = window.location.pathname.split('/').pop() || 'index.html';
            const map = {
                'index.html': 'home',
                'about.html': 'about',
                'all-projects.html': 'projects',
                'blog.html': 'blog',
                'gallery.html': 'gallery'
            };
            const hash = window.location.hash.replace('#', '');
            let activeKey = map[path] || null;
            if (hash === 'services') activeKey = 'services';
            if (hash === 'contact') activeKey = 'contact';

            if (activeKey) {
                document.querySelectorAll('nav a[data-nav]').forEach(a => {
                    if (a.getAttribute('data-nav') === activeKey) a.classList.add('active');
                });
            }
        })();

        // Scroll state — for sticky blur
        (function() {
            const header = document.querySelector('header');
            if (!header) return;
            const onScroll = () => {
                if (window.scrollY > 80) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            };
            window.addEventListener('scroll', onScroll, { passive: true });
            onScroll();
        })();
    </script>
</header>
